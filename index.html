<!doctype html><html lang="fr"><head>

<meta name="description" content="WAPI POCKET — compagnon mobile WAPILOT"><title>WAPI POCKET · WAPILOT</title>

<div id="screen-login" class="login-screen">
 <div class="login-wrap"><div class="login-brand"><img src="./icons/icon-192.png" alt="Logo WAPILOT"><span>WAPI POCKET<small>Votre WAPILOT, sur le terrain.</small></span></div>
 <section class="panel login-panel"><h1>Bienvenue</h1><p class="muted">Connectez-vous avec <b>vos identifiants habituels WAPILOT</b>.</p>
 <form id="login-form"><label>E-mail professionnel<input name="email" type="email" autocomplete="username" required placeholder="adresse@dl-groupe.be"></label>

 <button class="primary wide" id="btn-login" type="submit">Se connecter</button></form>
 <button class="link" id="btn-reset" type="button">Mot de passe oublié ?</button><p id="login-message" role="status" class="small status-text"></p></section>
 <div class="tiny muted centered">Accès professionnel · Données partagées avec WAPILOT</div></div></div>
<div id="app" class="app hidden">
 <header class="topbar"><div class="brand-lockup"><img src="./icons/icon-192.png" alt=""><span><b>WAPI POCKET</b><small id="user-title">Connecté à WAPILOT</small></span></div><div class="head-actions"><button id="sync" class="round" aria-label="Actualiser">↻</button><button id="account" class="round avatar" aria-label="Compte">●</button></div></header>
 <div id="context" class="context hidden"><span id="context-name"></span><button id="clear-context" aria-label="Retirer filtre">×</button></div>
 <div id="banner" class="banner hidden" role="status"></div>
 <main id="main" class="main" tabindex="-1"></main>
 <nav class="nav" aria-label="Navigation principale"><button data-page="home" class="active"><span>⌂</span>Accueil</button><button data-page="mails"><span>✉</span>Mails</button><button data-page="capture" class="nav-capture"><span>＋</span>Capturer</button><button data-page="tasks"><span>☷</span>Tâches</button><button data-page="copros"><span>▦</span>Copros</button></nav>
</div><div id="modal-root"></div><div id="toast" role="status" class="toast hidden"></div>
